output_dir: {{ project_root }}/output/relation_probe

dataset:
  class: Metafam
  root: {{ project_root }}/datasets
  version: Metafam

model:
  class: Merc
  relation_model:
    hidden_dim: 32
    num_heads: 4
  entity_model:
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    model_list: [rotate, split, dual]
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    attn_dropout: 0.1
    entropy_reg_weight: 0.003

train:
  gpus: auto
  batch_size: 8

analysis:
  split: valid
  max_samples_per_relation: null
  sampling_seed: 1024
  bootstrap_seed: 1024
  bootstrap_samples: 10000
  probe_batch_size: 8
  verify_single_candidate: yes
  min_samples: 3

checkpoint: {{ ckpt }}

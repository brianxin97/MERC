[project]
name = "merc-kgfm"
version = "0.1.0"
description = "MERC structural knowledge-graph foundation model artifact"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MERC Authors" }]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["merc/rspmm/source"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
